name: Deploy story

# Builds only the standalone story and publishes it to GitHub Pages.
# The rest of the frontend is present in the repo because the story imports
# its components and data from app/src — there is one copy of that source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            standalone/package-lock.json

      # The story source lives under app/src, so its third-party imports
      # resolve from app/node_modules; the standalone package supplies Vite
      # and the build entry.
      - run: npm ci --prefix app
      - run: npm ci --prefix standalone

      - name: Build story
        run: npm run build --prefix standalone
        env:
          STORY_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: standalone/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
